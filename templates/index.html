<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Analysis Bot</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h2 id="pair">EUR/USD (OTC)</h2>
        <p>Timeframe: <span id="timeframe">10 SEC</span></p>
    </div>

    <div class="signal-circle">
        <div class="signal-content">

            <div class="arrow" id="arrow">⬆</div>

            <div class="signal-label">
                SIGNAL
            </div>

            <div class="signal-type" id="signal">
                WAITING...
            </div>

        </div>
    </div>

    <div class="cards">

        <div class="card">

            <div class="card-title">
                SIGNAL STRENGTH
            </div>

            <div id="dots" class="dots">
                ○ ○ ○ ○ ○
            </div>

            <div id="strengthText">
                0/5
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                WIN RATE
            </div>

            <div class="card-value" id="winrate">
                0%
            </div>

        </div>

    </div>

    <div class="processing">
        ● AI PROCESSING ACTIVE
    </div>

    <button class="generate-btn" onclick="loadData()">
        Generate New Signal
    </button>

    <div class="bottom-nav">

        <div class="nav-item">📈 TRADE</div>
        <div class="nav-item">⚡ LIVE FEED</div>
        <div class="nav-item">⚙ SETTINGS</div>

    </div>

</div>

<script src="/script.js"></script>

</body>
</html>
